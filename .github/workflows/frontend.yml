name: frontend

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Script unit tests
        run: npm run test:scripts

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Zero-backend browser and accessibility tests
        run: npm run test:e2e

  visual:
    # Screenshot baselines are rasterised inside the Playwright image so every
    # machine agrees on fonts and anti-aliasing. Regenerate with
    # `npm run test:visual:update` in the same image (docs/media/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Visual baselines
        run: |
          if [ -d e2e/__snapshots__ ]; then npm run test:visual; else echo "no baselines committed yet — skipping"; fi
